services:
  home-connect-mqtt:
    container_name: hc_bosch
    build: .
    restart: unless-stopped
    env_file: .env

    environment:
      - TZ=Europe/Berlin
      - PYTHONUNBUFFERED=1

    ports:
      - "${DASHBOARD_PORT:-5021}:${DASHBOARD_PORT:-5021}"

    volumes:
      - ${PWD}/data:/app/data
      - ${PWD}/app/config:/app/app/config
      - ${PWD}/logs:/app/logs
      - ${PWD}/frontend:/app/frontend

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:${DASHBOARD_PORT:-5021}/api/health')\" || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
