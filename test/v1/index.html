<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spülmaschinen Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 2. Chart.js für die Diagramme -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">

    <div class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
        <!-- Header -->
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400 flex items-center gap-3">
                🍽️ DISHWASHER // CORE
            </h1>
            <div id="connection-badge" class="text-xs font-bold px-3 py-1 rounded-full bg-slate-800 text-slate-400 uppercase tracking-wider">
                Verbindung wird aufgebaut...
            </div>
        </header>

        <!-- Dashboard Grid -->
        <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Linke Spalte: Live Zustand & Diagramm -->
            <div class="md:col-span-2 space-y-6">

                <div id="live-container"></div>

                <div id="chart-container" class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl">

                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Temperaturverlauf & Spülzyklen</h2>
                        <span class="text-xs bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded border border-blue-500/20">Live</span>
                    </div>

                    <div class="h-64 relative">
                        <canvas id="dishwasherChart"></canvas>
                    </div>

                </div>
            </div>

            <!-- Rechte Spalte: Statistiken & KPIs -->
            <div class="space-y-6" id="stats-container"></div>
        </main>

        <!-- Footer / Debug Sektion ganz unten -->
        <footer class="border-t border-slate-900 pt-6" id="debug-container"></footer>
    </div>

    <!-- Das Haupt-Modul laden -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
